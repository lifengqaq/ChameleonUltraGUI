name: CPU card regression
on:
  push:
    branches: ['feature/iso14443-4-cpu']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chameleonultragui
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Analyze CPU tools and protocol helpers
        run: >-
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
          lib/gui/menu/tools/cpu_card.dart lib/helpers/iso14443_4.dart
          lib/helpers/hf14a4_slot.dart lib/bridge/chameleon.dart
      - name: Run CPU and compatibility regressions
        run: >-
          flutter test test/iso14443_4_test.dart test/hf14a4_card_type_test.dart
          test/raw_commands_test.dart
      - name: Produce formatting patch
        if: always()
        run: |
          dart format lib/helpers/iso14443_4.dart lib/helpers/hf14a4_slot.dart lib/gui/menu/tools/cpu_card.dart test/iso14443_4_test.dart
          git diff --binary > cpu-format.patch
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cpu-source-format
          path: chameleonultragui/cpu-format.patch