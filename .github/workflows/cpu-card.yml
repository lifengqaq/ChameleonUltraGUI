name: CPU card regression
on:
  push:
    branches: ['feature/iso14443-4-cpu']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chameleonultragui
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Analyze CPU tools and protocol helpers
        run: >-
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
          lib/gui/menu/tools/cpu_card.dart lib/helpers/iso14443_4.dart
          lib/gui/menu/tools/cpu_emv_summary.dart lib/helpers/cpu_emv.dart
          lib/gui/menu/tools/cpu_card_manager.dart lib/gui/menu/tools/cpu_profiles.dart lib/helpers/cpu_card_access.dart test/cpu_card_access_test.dart
          lib/helpers/cpu_directory.dart lib/gui/menu/tools/cpu_directory_view.dart
          lib/helpers/cpu_directory_record.dart test/cpu_card_explorer_test.dart
          lib/helpers/cpu_live_archive.dart lib/helpers/cpu_type4.dart lib/helpers/cpu_transit_info.dart lib/gui/menu/pages/cpu_archive_view.dart
          lib/gui/menu/dialogs/card/cpu_change_pin.dart
          test/cpu_emv_test.dart test/cpu_page_storage_test.dart lib/helpers/iso7816_fs.dart
          lib/gui/menu/tools/cpu_filesystem.dart test/iso7816_fs_test.dart test/cpu_slot_transaction_test.dart
          lib/gui/page/slot_manager.dart lib/gui/page/read_card.dart lib/gui/page/tools.dart
          lib/gui/menu/tools/raw_commands.dart lib/helpers/ui_diagnostics.dart lib/main.dart
          lib/helpers/hf14a4_slot.dart lib/bridge/chameleon.dart
          lib/helpers/sm4.dart
          lib/helpers/cpu_auth.dart lib/helpers/cpu_dump.dart lib/helpers/cpu_security.dart lib/helpers/slot_dump.dart lib/sharedprefsprovider.dart lib/gui/menu/dialogs/card/cpu_auth.dart lib/gui/menu/dialogs/card/cpu_dump.dart lib/gui/menu/dialogs/card/cpu_security.dart lib/gui/menu/dialogs/card/edit.dart lib/gui/menu/dialogs/card/view.dart lib/gui/menu/dialogs/slot/settings.dart lib/gui/menu/pages/cpu_data_editor.dart test/cpu_auth_test.dart test/cpu_native_test.dart
      - name: Build native library required by the full test suite
        run: |
          cmake -S src -B build/native-recovery -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native-recovery --parallel 2
      - name: Run full GUI and compatibility regressions
        env:
          LIBRECOVERY_PATH: ${{ github.workspace }}/chameleonultragui/build/native-recovery/librecovery.so
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee cpu-test.log
      - name: Produce formatting patch
        if: always()
        run: |
          dart format test/cpu_page_storage_test.dart test/cpu_slot_transaction_test.dart lib/helpers/ui_diagnostics.dart lib/gui/page/read_card.dart lib/gui/page/tools.dart lib/gui/menu/tools/raw_commands.dart lib/helpers/iso7816_fs.dart lib/gui/menu/tools/cpu_filesystem.dart test/iso7816_fs_test.dart lib/helpers/iso14443_4.dart lib/helpers/hf14a4_slot.dart lib/gui/menu/tools/cpu_card.dart test/iso14443_4_test.dart lib/helpers/cpu_emv.dart lib/gui/menu/tools/cpu_emv_summary.dart test/cpu_emv_test.dart lib/helpers/cpu_auth.dart lib/helpers/cpu_dump.dart lib/helpers/cpu_security.dart lib/helpers/slot_dump.dart lib/sharedprefsprovider.dart lib/gui/menu/dialogs/card/cpu_auth.dart lib/gui/menu/dialogs/card/cpu_dump.dart lib/gui/menu/dialogs/card/cpu_security.dart lib/gui/menu/dialogs/card/edit.dart lib/gui/menu/dialogs/card/view.dart lib/gui/menu/dialogs/slot/settings.dart lib/gui/menu/pages/cpu_data_editor.dart test/cpu_auth_test.dart test/cpu_native_test.dart
          git diff --binary > cpu-format.patch
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cpu-source-format
          path: |
            chameleonultragui/cpu-format.patch
            chameleonultragui/cpu-test.log
